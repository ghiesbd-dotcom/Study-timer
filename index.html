<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>مؤقت الدراسة</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #101827;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 450px;
      text-align: center;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #aab4c3;
      margin-bottom: 30px;
    }

    .timer {
      font-size: 65px;
      font-weight: bold;
      margin: 30px 0;
      letter-spacing: 2px;
    }

    .status {
      color: #8fa0b5;
      margin-bottom: 25px;
    }

    button {
  width: 100%;
  padding: 16px;
  margin: 7px 0;
  border: none;
  border-radius: 14px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

#startBtn {
  background: #22c55e;
  color: white;
}

#stopBtn {
  background: #ef4444;
  color: white;
}

#resetBtn {
  background: #334155;
  color: white;
}
.card {
  background: #1b2638;
  border-radius: 18px;
  padding: 20px;
  margin-top: 25px;
}

.card-title {
  color: #aab4c3;
  margin-bottom: 8px;
}

.total {
  font-size: 28px;
  font-weight: bold;
}
</style>

</head>

<body>

<div class="container">

  <h1>📚 مؤقت الدراسة</h1>

  <div class="subtitle">
    ركّز بالدراسة وخلي المؤقت يحسب وقتك
  </div>

  <div class="timer" id="timer">
    00:00:00
  </div>

  <div class="status" id="status">
    جاهز للدراسة
  </div>

  <button id="startBtn" onclick="startStudy()">
    ▶️ ابدأ الدراسة
  </button>

  <button id="stopBtn" onclick="stopStudy()">
    ⏹️ إيقاف الدراسة
  </button>

  <button id="resetBtn" onclick="resetToday()">
    🔄 تصفير وقت اليوم
  </button>

  <div class="card">
    <div class="card-title">
      مجموع دراستك اليوم
    </div>

    <div class="total" id="total">
      00:00:00
    </div>
  </div>

</div>

<script>

let studying = false;
let startTime = 0;
let totalTime = Number(localStorage.getItem("studyTotal")) || 0;

function formatTime(ms) {
  let seconds = Math.floor(ms / 1000);
  let hours = Math.floor(seconds / 3600);
  let minutes = Math.floor((seconds % 3600) / 60);
  seconds = seconds % 60;

  return String(hours).padStart(2,"0") + ":" +
         String(minutes).padStart(2,"0") + ":" +
         String(seconds).padStart(2,"0");
}

function update() {
  if (!studying) return;

  document.getElementById("timer").textContent =
    formatTime(Date.now() - startTime);

  requestAnimationFrame(update);
}

function startStudy() {
  if (studying) return;

  studying = true;
  startTime = Date.now();

  document.getElementById("status").textContent =
    "🟢 عم تدرس الآن...";

  update();
}

function stopStudy() {
  if (!studying) return;

  totalTime += Date.now() - startTime;
  localStorage.setItem("studyTotal", totalTime);

  studying = false;

  document.getElementById("timer").textContent =
    "00:00:00";

  document.getElementById("status").textContent =
    "⏸️ تم إيقاف الدراسة";

  document.getElementById("total").textContent =
    formatTime(totalTime);
}

function resetToday() {
  totalTime = 0;
  localStorage.setItem("studyTotal", 0);

  document.getElementById("total").textContent =
    "00:00:00";

  document.getElementById("status").textContent =
    "تم تصفير وقت اليوم";
}

document.getElementById("total").textContent =
  formatTime(totalTime);

</script>

</body>
</html>
